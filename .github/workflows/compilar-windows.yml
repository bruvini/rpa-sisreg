name: Compilar RPA SISREG para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'requirements-build.txt'
      - 'compilar_windows.ps1'
      - '.github/workflows/compilar-windows.yml'
permissions:
  contents: read
jobs:
  gerar-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Python somente no ambiente de compilacao
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Instalar bibliotecas
        run: python -m pip install -r requirements-build.txt
      - name: Executar testes unitarios e de integracao sintetica
        run: python -m unittest discover -s tests -v
      - name: Gerar SISREG_Login.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name SISREG_Login --paths src --collect-all playwright --collect-all pymupdf --collect-all openpyxl src/sisreg_login.py
      - name: Registrar SHA-256 do executavel
        shell: pwsh
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 dist/SISREG_Login.exe).Hash
          "SISREG_Login.exe SHA256: $sha" | Out-File -FilePath dist/SHA256.txt -Encoding utf8
      - name: Disponibilizar EXE Windows
        uses: actions/upload-artifact@v4
        with:
          name: SISREG_Login_Windows
          path: |
            dist/SISREG_Login.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
