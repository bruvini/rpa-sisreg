name: Compilar RPA SISREG para Windows
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'scripts/**'
      - 'README.md'
      - 'tests/**'
      - 'requirements-build.txt'
      - 'compilar_windows.ps1'
      - '.github/workflows/compilar-windows.yml'
permissions:
  contents: read
jobs:
  gerar-exe:
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4
      - name: Preparar Python somente no ambiente de compilacao
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-build.txt
      - name: Instalar bibliotecas
        run: python -m pip install -r requirements-build.txt
      - name: Executar testes unitarios e de integracao sintetica
        run: python -m unittest discover -s tests -v
      - name: Metadados da versão e data da compilação
        run: python scripts/preparar_compilacao.py
      - name: Gerar RPA_SISREG.exe
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name RPA_SISREG --icon assets/Logo-SISREG.ico --add-data "assets;assets" --paths src --version-file versao_windows.txt --collect-all playwright --collect-all pymupdf --collect-all openpyxl src/sisreg_login.py
      - name: Registrar SHA-256 do executavel
        shell: pwsh
        run: |
          $sha = (Get-FileHash -Algorithm SHA256 dist/RPA_SISREG.exe).Hash
          "RPA_SISREG.exe SHA256: $sha" | Out-File -FilePath dist/SHA256.txt -Encoding utf8
      - name: Disponibilizar EXE Windows
        uses: actions/upload-artifact@v4
        with:
          name: RPA_SISREG_Windows
          path: |
            dist/RPA_SISREG.exe
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7
